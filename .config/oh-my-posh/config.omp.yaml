      - type: rust
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#99908a"
        foreground: "#193549"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: swift
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#f6553c"
        foreground: "#ffffff"
        template: " {{ .Full }}  "
        options:
          display_mode: files
