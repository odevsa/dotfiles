$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
palette:
  background-base: "#333333"
  background-primary: "#1793d1"
  background-danger: "#DE2121"
  background-success: "#1c9f41"
  background-git: "#224466"

  foreground-base: "#CCCCCC"
  foreground-primary: "#FFFFFF"
  foreground-danger: "#FFFFFF"
  foreground-success: "#FFFFFF"
  foreground-git: "#77d3ff"

  path-separator: "#555555"
  separator: "#222222"

blocks:
  - alignment: left
    type: prompt
    segments:
      - type: text
        style: plain
        template: 
        foreground: p:background-primary
      - type: os
        style: plain
        background: p:background-primary
        foreground: p:foreground-primary
        template: " <foreground,background>{{ .Icon }}</> <background,p:separator></>"
      - type: root
        style: powerline
        powerline_symbol: 
        background: p:background-danger
        foreground: p:foreground-danger
        template: "  "
      - type: path
        style: powerline
        powerline_symbol: 
        background: p:background-base
        foreground: p:foreground-base
        template: " {{ .Path }} "
        options:
          folder_icon: "~"
          folder_separator_icon: " <p:path-separator></> "
          home_icon: ""
          style: "agnoster_short"
      - type: git
        style: powerline
        powerline_symbol: 
        background: p:background-git
        foreground: p:foreground-git
        template: " {{ .UpstreamIcon }} {{ .HEAD }}{{ if .Staging.Changed }} \uf046 {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} \ueb4b {{ .StashCount }}{{ end }} "
        options:
          fetch_status: true
          fetch_upstream_icon: true

  - alignment: right
    type: rprompt
    segments:
      - type: clojure
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#9068B0"
        foreground: "#ffffff"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: crystal
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#4063D8"
        foreground: "#ffffff"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: dart
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#06A4CE"
        foreground: "#ffffff"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: dotnet
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#00ffff"
        foreground: "#000000"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: elixir
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#422251"
        foreground: "#ffffff"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: fortan
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#422251"
        foreground: "#ffffff"
        template: " {{ .Full }} 󱈚 "
        options:
          display_mode: files
          fetch_version: true
      - type: go
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#7FD5EA"
        foreground: "#ffffff"
