        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: vala
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#5E20A4"
        foreground: "#ffffff"
        template: " {{ .Full }}  "
        options:
