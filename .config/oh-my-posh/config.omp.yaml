        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: ocaml
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#444444"
        foreground: "#d08770"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true
      - type: perl
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#4063D8"
