          fetch_version: true
      - type: zig
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: "#ffad55"
        foreground: "#342311"
        template: " {{ .Full }}  "
        options:
          display_mode: files
          fetch_version: true

      - type: executiontime
        style: powerline
        powerline_symbol: 
        invert_powerline: true
        background: p:background-base
        foreground: p:foreground-base
        template: " {{ .FormattedMs }} "
        options:
          always_enabled: true
      - type: status
        style: plain
        background: p:background-success
        background_templates:
          - "{{ if gt .Code 0 }}p:background-danger{{ end }}"
        foreground: p:foreground-success
        foreground_templates:
          - "{{ if gt .Code 0 }}p:foreground-danger{{ end }}"
        template: "<background,p:separator></> <foreground,background>{{ if eq .Code 0 }}{{ else }}{{ end }}</> "
        options:
          always_enabled: true
      - type: text
        style: plain
        template: 
        foreground: p:background-success
        foreground_templates:
          - "{{ if gt .Code 0 }}p:background-danger{{ end }}"

console_title_template: '{{if .Root}} ⚡ {{end}}{{.Folder | replace "~" ""}} @ {{.HostName}}'
final_space: true
version: 4
